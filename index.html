<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <header class="top-header">
            <div class="header-left">
                <button id="menu-toggle" class="menu-btn" aria-label="Open Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <div class="greeting-container">
                    <h1 id="user-greeting">Good morning, Champ</h1>
                    <p class="greeting-subtext">Let's make today a saving day</p>
                </div>
            </div>

            <div class="header-right">
                <button class="icon-btn" aria-label="Notifications">🔔</button>
                <div class="avatar-badge">A</div>
                </div>
            </div>
        </header>
    </div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <span class="brand-name">Penny Bloom</span>
            </div>
            <button id="close-menu-btn" class="close-btn" aria-label="Close Menu">X</button>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">Dashboard</a>
            <a href="#" class="nav-item placeholder-link">Goals</a>
            <a href="#" class="nav-item placeholder-link">Calendar</a>
            <a href="#" class="nav-item placeholder-link">Transactions</a>
            <a href="#" class="nav-item placeholder-link">Analytics</a>
            <a href="#" class="nav-item placeholder-link">Rewards</a>
            <a href="#" class="nav-item placeholder-link">Shop</a>
            <a href="#" class="nav-item placeholder-link">Settings</a>
        </nav>

        <div class="sidebar-footer">
            <button id="logout-btn" class="logout-btn">Log Out</button>
        </div>
    </aside>
    
    <div id="overlay" class="overlay"></div>
    <script src="script.js"></script>
</body>
</html>
