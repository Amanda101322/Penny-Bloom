<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <button id="menu-toggle" class="menu-btn" aria-label="Open Menu">
                <i data-lucide="menu"></i>
                </button>
            </div>
                <div class="greeting-container">
                    <h1 id="user-greeting">Good morning, Champ</h1>
                    <p class="greeting-subtext">Let's make today a saving day!</p>
                </div>

            <!-- Right Header -->
            <div class="header-right">
                <button 
                 class="notification-btn"
                 aria-label="Notifications">
                    <i data-lucide="bell"></i>
                </button>

                <!-- Dashboard Profile -->
                <button class="profile-btn" aria-label="Open profile">
                <div class="avatar">A</div>
                <div class="profile-info">
                    <span class="profile-name">Amanda</span>

                    <i data-lucide="chevron-down"></i>
                </div>
            </button>
        </div>
    </header>

<!-- Sidebar Drawer -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon"> <i data-lucide="piggy-bank"></i></div>
                <div class="brand-text">
                    <span>Penny</span><span>Bloom</span>
                </div>
            </div>

            <!-- Close Button -->
            <button id="close-menu-btn" class="close-btn" aria-label="Close Menu">
                <i data-lucide="x"></i>
            </button>
        </div>
<!-- Sidebar Navigation -->
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="target"></i>
                <span>Goals</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>Calendar</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="arrow-left-right"></i>
                <span>Transactions</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="chart-no-axes-combined"></i>
                <span>Analytics</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="trophy"></i>
                <span>Rewards</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="shopping-bag"></i>
                <span>Shop</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <button id="logout-btn" class="logout-btn">
                <i data-lucide="log-out"></i>
                <span>Log Out</span>
            </button>
        </div>
    </aside>
    
    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JavaScript file connection-->
    <script src="script.js"></script>
</body>
</html>
